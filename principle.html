<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCLINE 跨语言激活干预动态演示</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #f3f4f6; margin: 0; padding: 20px; font-family: system-ui, -apple-system, sans-serif; }
        .fixed-container {
            width: 1200px;
            height: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .header { height: 80px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 24px; justify-content: space-between; background: #ffffff; }
        .content { display: flex; flex: 1; overflow: hidden; background: #f9fafb; }
        .panel { flex: 1; padding: 24px; display: flex; flex-direction: column; position: relative; border-right: 1px solid #e5e7eb; transition: opacity 0.3s; }
        .panel:last-child { border-right: none; }
        .inactive-panel { opacity: 0.4; pointer-events: none; }
        
        /* Data grid specific styles */
        .vector-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .vector-cell { height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; font-weight: bold; }
        
        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* specific color themes */
        .color-pt { background-color: #f97316; } /* Orange */
        .color-en { background-color: #3b82f6; } /* Blue */
        .color-mix { background-color: #8b5cf6; } /* Purple */
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Mock Data ---
        const PARALLEL_DATA = [
            { id: 1, pt: "O céu é azul.", en: "The sky is blue." },
            { id: 2, pt: "O artigo foi embalado...", en: "The item was wrapped..." },
            { id: 3, pt: "Mais 498 frases...", en: "498 more sentences..." }
        ];

        // --- UI Components ---
        const VectorBox = ({ label, values, colorClass }) => (
            <div className="bg-white p-3 rounded shadow-sm border border-gray-200 mt-2 fade-in">
                <div className="text-sm font-semibold mb-2 text-gray-700">{label}</div>
                <div className="vector-grid">
                    {values.map((v, i) => (
                        <div key={i} className={`vector-cell ${colorClass}`} style={{opacity: 0.7 + (Math.abs(v) * 0.3)}}>
                            {v.toFixed(1)}
                        </div>
                    ))}
                </div>
            </div>
        );

        const MatrixBox = () => (
            <div className="bg-white p-3 rounded shadow-sm border border-gray-200 mt-4 fade-in bg-green-50">
                <div className="text-sm font-bold mb-2 text-green-800">对齐矩阵 W (最小二乘法计算得出)</div>
                <div className="text-xs text-green-700 font-mono bg-green-100 p-2 rounded">
                    W = (H_pt^T * H_pt)^-1 * H_pt^T * H_en
                </div>
                <div className="grid grid-cols-4 gap-1 mt-2 opacity-80">
                    {[0.9, -0.1, 0.2, 0.1, 0.1, 0.8, -0.2, 0.3, -0.2, 0.1, 0.9, 0.0, 0.0, 0.2, 0.1, 0.8].map((v, i) => (
                        <div key={i} className="bg-green-600 h-6 text-white text-[10px] flex items-center justify-center rounded">
                            {v.toFixed(1)}
                        </div>
                    ))}
                </div>
            </div>
        );

        const INCLINEApp = () => {
            const [step, setStep] = useState(0);

            // Update Lucide icons after render
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [step]);

            const nextStep = () => setStep(s => Math.min(s + 1, 6));
            const prevStep = () => setStep(s => Math.max(s - 1, 0));
            const reset = () => setStep(0);

            // Step Descriptions
            const stepInfos = [
                "准备阶段：系统初始化",
                "第一步：输入 500 句平行语料 (葡萄牙语-英语) 用于特征提取。",
                "第二步：提取 LLM 每一层最后一个 Token 的隐藏状态向量 (H_pt 和 H_en)。",
                "第三步：通过最小二乘法计算对齐矩阵 W，完成离线学习。此后 W 固定不变。",
                "第四步：推理阶段，用户输入葡萄牙语问题，LLM 开始逐层处理。",
                "第五步：拦截最后一层的隐藏状态 h_s，使用 W 投影，并与原向量按权重 α 混合得到 h_mix。",
                "第六步：利用对齐后的向量 h_mix 生成输出，成功利用了英文空间的推理能力输出正确答案 A。"
            ];

            return (
                <div className="fixed-container">
                    {/* Header */}
                    <div className="header">
                        <div>
                            <h1 className="text-xl font-bold text-gray-800">INCLINE 机制可视化</h1>
                            <div className="text-sm text-gray-500 font-medium mt-1">当前步骤 {step}/6：{stepInfos[step]}</div>
                        </div>
                        <div className="flex space-x-3">
                            <button onClick={reset} className="px-4 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50 flex items-center">
                                <i data-lucide="rotate-ccw" className="w-4 h-4 mr-2"></i> 重置
                            </button>
                            <button onClick={prevStep} disabled={step === 0} className={`px-4 py-2 rounded flex items-center ${step === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'}`}>
                                <i data-lucide="arrow-left" className="w-4 h-4 mr-2"></i> 上一步
                            </button>
                            <button onClick={nextStep} disabled={step === 6} className={`px-4 py-2 rounded flex items-center text-white ${step === 6 ? 'bg-blue-300 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                下一步 <i data-lucide="arrow-right" className="w-4 h-4 ml-2"></i>
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="content">
                        
                        {/* Left Panel: Offline Learning */}
                        <div className={`panel ${step >= 4 ? 'inactive-panel' : ''}`}>
                            <h2 className="text-lg font-bold text-gray-800 border-b pb-2 mb-4 flex items-center">
                                <i data-lucide="database" className="w-5 h-5 mr-2 text-blue-500"></i> 
                                第一阶段：离线学习跨语言对齐 (Step 1-3)
                            </h2>
                            
                            {/* Step 1: Parallel Data */}
                            <div className="mb-4">
                                <div className={`p-3 rounded border ${step >= 1 ? 'bg-white border-blue-200 shadow-sm' : 'bg-gray-100 border-gray-200 text-transparent opacity-30'}`}>
                                    <div className={`text-sm font-bold mb-2 ${step >= 1 ? 'text-gray-700' : 'text-transparent'}`}>500 句平行语料库</div>
                                    {PARALLEL_DATA.map(d => (
                                        <div key={d.id} className="grid grid-cols-2 gap-2 text-xs mb-1">
                                            <div className={`p-1 rounded ${step >= 1 ? 'bg-orange-100 text-orange-800' : 'bg-gray-200'}`}>[PT] {d.pt}</div>
                                            <div className={`p-1 rounded ${step >= 1 ? 'bg-blue-100 text-blue-800' : 'bg-gray-200'}`}>[EN] {d.en}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Step 2: Extract Hidden States */}
                            {step >= 2 && (
                                <div className="mb-4 flex gap-4">
                                    <div className="flex-1 relative">
                                        <div className="absolute top-0 left-1/2 -mt-4 w-px h-4 bg-gray-300"></div>
                                        <VectorBox label="源语言向量矩阵 (H_pt)" values={[0.5, -0.2, 0.8, 0.1, 0.4, -0.3, 0.7, 0.2]} colorClass="color-pt" />
                                    </div>
                                    <div className="flex-1 relative">
                                        <div className="absolute top-0 left-1/2 -mt-4 w-px h-4 bg-gray-300"></div>
                                        <VectorBox label="目标语言向量矩阵 (H_en)" values={[0.8, 0.1, 0.9, -0.1, 0.7, 0.2, 0.8, -0.2]} colorClass="color-en" />
                                    </div>
                                </div>
                            )}

                            {/* Step 3: Calculate Matrix W */}
                            {step >= 3 && (
                                <div className="relative">
                                    <div className="absolute -top-4 left-1/2 w-px h-4 bg-gray-300"></div>
                                    <MatrixBox />
                                    <div className="mt-4 bg-yellow-50 border border-yellow-200 p-3 rounded text-xs text-yellow-800 flex items-start">
                                        <i data-lucide="info" className="w-4 h-4 mr-2 flex-shrink-0 mt-0.5"></i>
                                        <span>注意：计算出的矩阵 W 仅提取了一次，随后将冻结并在推理阶段反复使用，没有任何 LLM 参数被更新。</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Right Panel: Inference Intervention */}
                        <div className={`panel ${step < 4 ? 'inactive-panel' : ''} bg-white`}>
                            <h2 className="text-lg font-bold text-gray-800 border-b pb-2 mb-4 flex items-center">
                                <i data-lucide="zap" className="w-5 h-5 mr-2 text-purple-500"></i> 
                                第二阶段：推理时动态变换 (Step 4-6)
                            </h2>

                            {/* Step 4: User Input */}
                            <div className="mb-6">
                                <div className={`p-4 rounded border ${step >= 4 ? 'bg-orange-50 border-orange-200 shadow-sm' : 'bg-gray-100 border-gray-200 opacity-30'}`}>
                                    <div className={`text-sm font-bold mb-1 ${step >= 4 ? 'text-orange-800' : 'text-transparent'}`}>用户输入 (下游测试任务)</div>
                                    <div className={`font-mono text-sm ${step >= 4 ? 'text-gray-800' : 'text-transparent'}`}>
                                        Pergunta: O artigo foi embalado em plástico bolha. Qual a causa?<br/>
                                        A: Era frágil.<br/>
                                        B: Era pequeno.<br/>
                                        <span className="font-bold bg-orange-200 px-1 rounded">Resposta:</span> 
                                        <span className="text-gray-400 italic text-xs ml-2">&lt;- LLM 停在此最后一个 Token</span>
                                    </div>
                                </div>
                            </div>

                            {/* Step 5: Intercept and Transform */}
                            <div className="flex flex-col items-center">
                                {step >= 4 && <div className="w-px h-6 bg-gray-300"></div>}
                                
                                {step >= 5 && (
                                    <div className="w-full bg-white border border-gray-200 p-4 rounded shadow-sm relative fade-in">
                                        <div className="absolute right-4 top-4 text-xs font-bold text-gray-400">LLM 某一层</div>
                                        
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="w-1/3">
                                                <div className="text-xs text-center text-gray-500 mb-1">拦截原始向量 (h_s)</div>
                                                <div className="vector-grid">
                                                    {[0.3, -0.4, 0.6, 0.1].map((v, i) => <div key={i} className="vector-cell color-pt">{v}</div>)}
                                                </div>
                                            </div>
                                            
                                            <div className="w-1/3 flex flex-col items-center">
                                                <div className="text-[10px] bg-green-100 text-green-800 px-2 py-1 rounded mb-1 font-bold">乘矩阵 W 投影</div>
                                                <i data-lucide="arrow-right" className="w-4 h-4 text-gray-400"></i>
                                            </div>

                                            <div className="w-1/3">
                                                <div className="text-xs text-center text-gray-500 mb-1">获得投影向量 (W*h_s)</div>
                                                <div className="vector-grid">
                                                    {[0.7, 0.1, 0.8, -0.1].map((v, i) => <div key={i} className="vector-cell color-en">{v}</div>)}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-purple-50 p-3 rounded border border-purple-200 text-center relative mt-6">
                                            <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-white px-2 text-xs font-bold text-purple-700">特征混合 (α = 0.5)</div>
                                            <div className="font-mono text-sm text-purple-800 font-bold mb-2">h_mix = h_s + α * (W * h_s)</div>
                                            <div className="flex justify-center w-full">
                                                <div className="w-1/2 vector-grid">
                                                    {[0.65, -0.35, 0.7, 0.0].map((v, i) => <div key={i} className="vector-cell color-mix">{v}</div>)}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-center mt-2 text-xs text-gray-500">将 h_mix 替换原隐藏状态，喂给下一层</div>
                                    </div>
                                )}
                            </div>

                            {/* Step 6: Output */}
                            <div className="flex flex-col items-center flex-1">
                                {step >= 6 && <div className="w-px h-6 bg-purple-300"></div>}
                                
                                {step >= 6 && (
                                    <div className="w-full bg-green-50 border-2 border-green-500 p-4 rounded shadow-md text-center fade-in">
                                        <div className="text-sm font-bold text-green-800 mb-2">生成输出</div>
                                        <div className="text-2xl font-black text-green-600">A: Era frágil.</div>
                                        <div className="text-xs text-green-700 mt-2 text-left bg-green-100 p-2 rounded">
                                            <span className="font-bold">分析：</span>由于表示向量 h_mix 吸收了英文特征，LLM 成功调取了对应于英文 "bubble wrap -> fragile" 的高阶逻辑，输出了准确的选项 A。
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<INCLINEApp />);
    </script>
</body>
</html>
